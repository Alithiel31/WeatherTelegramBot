name: Bot Weather CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v7

    - name: Installation de Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Vérification du formatage (Black)
      run: black --check .

    - name: Analyse statique (Flake8)
      run: flake8 . --count --max-line-length=88 --statistics

    - name: Vérification des types (Mypy)
      run: mypy --ignore-missing-imports .

    - name: Exécution des tests (Pytest)
      run: pytest

    - name: Audit des dépendances (pip-audit)
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v7

    - name: Build de l'image Docker
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: weather-telegram-bot:ci
