[mypy]
ignore_missing_imports = True
exclude = (^tests/|^\.venv/)

# python-telegram-bot types update.message / effective_chat / user_data as
# Optional even though our filters (filters.TEXT & ~filters.COMMAND) guarantee
# they're present in these handlers. Relaxing these two entrypoint modules
# rather than sprinkling asserts on every line; business logic modules
# (weather_api, rate_limiter, metrics, config) stay fully checked.
[mypy-weather_bot.handlers]
disable_error_code = union-attr, arg-type, index

[mypy-main]
disable_error_code = arg-type
