services:
  weather-bot:
    build: .
    container_name: telegram_weather_bot
    restart: unless-stopped
    labels:
      - "homelab.tier=app"
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

volumes:
  bot_data: